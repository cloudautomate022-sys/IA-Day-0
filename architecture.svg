<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1050" viewBox="0 0 1440 1050" role="img" aria-labelledby="title description">
  <title id="title">Fieldnote AI system architecture</title>
  <desc id="description">Current browser-only prototype and recommended production architecture, with model, data source, storage, and security flows.</desc>
  <defs>
    <marker id="arrow-green" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9z" fill="#47745a"/></marker>
    <marker id="arrow-gold" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9z" fill="#9a8552"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#1d2a23}.eyebrow{font-size:13px;font-weight:700;letter-spacing:1.5px}.title{font-size:28px;font-weight:700}.subtitle{font-size:14px;fill:#68766e}.section{font-size:18px;font-weight:700}.tag{font-size:11px;font-weight:700;letter-spacing:1px}.node-title{font-size:15px;font-weight:700}.node-copy{font-size:12px;fill:#5b6960}.small{font-size:11px;fill:#617067}.note{font-size:12px;font-weight:600}.node{fill:#fff;stroke:#c9d7cc;stroke-width:1.5}.node-green{fill:#e8f1e8;stroke:#47745a;stroke-width:1.5}.node-blue{fill:#edf2f6;stroke:#637e91;stroke-width:1.5}.node-gold{fill:#fbf8ed;stroke:#a18d5d;stroke-width:1.5;stroke-dasharray:7 5}.panel{fill:#fbfcf9;stroke:#dce4dc;stroke-width:1.5}.panel-proposed{fill:#fcfbf6;stroke:#d9cfb1;stroke-width:1.5;stroke-dasharray:9 6}.current-line{fill:none;stroke:#47745a;stroke-width:2;marker-end:url(#arrow-green)}.proposed-line{fill:none;stroke:#9a8552;stroke-width:2;stroke-dasharray:7 5;marker-end:url(#arrow-gold)}
    </style>
  </defs>
  <rect width="1440" height="1050" fill="#f4f5ef"/>
  <text x="52" y="49" class="eyebrow" fill="#47745a">FIELDNOTE AI / SYSTEM MAP</text>
  <text x="52" y="86" class="title">From agent setup to model response</text>
  <text x="52" y="111" class="subtitle">What runs today, and the secure architecture needed to connect real data sources.</text>

  <rect x="35" y="135" width="1370" height="345" rx="12" class="panel"/>
  <text x="62" y="174" class="section">01  Current prototype</text>
  <rect x="1190" y="151" width="185" height="28" rx="14" fill="#e8f1e8"/>
  <text x="1282" y="170" class="tag" text-anchor="middle" fill="#47745a">IMPLEMENTED</text>
  <rect x="58" y="194" width="960" height="258" rx="10" fill="#f5f8f3" stroke="#bfcfc2" stroke-width="1.5"/>
  <text x="78" y="220" class="small" font-weight="700">USER BROWSER</text>

  <rect x="82" y="245" width="215" height="112" rx="8" class="node-green"/>
  <text x="102" y="275" class="node-title">Fieldnote UI</text>
  <text x="102" y="300" class="node-copy">Agent studio · Chat</text>
  <text x="102" y="320" class="node-copy">Sources · Model settings</text>
  <text x="102" y="342" class="small">Runs in the browser</text>

  <rect x="365" y="239" width="245" height="105" rx="8" class="node"/>
  <text x="385" y="269" class="node-title">Agent configuration</text>
  <text x="385" y="294" class="node-copy">Prompt · model ID · source IDs</text>
  <text x="385" y="316" class="node-copy">Recent chat messages</text>
  <rect x="365" y="368" width="245" height="60" rx="8" class="node-green"/>
  <text x="385" y="393" class="node-title">localStorage</text>
  <text x="385" y="414" class="small">Agents · endpoint · selections</text>

  <rect x="672" y="239" width="285" height="105" rx="8" class="node"/>
  <text x="692" y="269" class="node-title">Source options</text>
  <text x="692" y="294" class="node-copy">SharePoint · OneDrive · Teams</text>
  <text x="692" y="316" class="node-copy">Web · file picker · notes</text>
  <rect x="672" y="368" width="285" height="60" rx="8" class="node-green"/>
  <text x="692" y="393" class="node-title">Page memory</text>
  <text x="692" y="414" class="small">API key · file names/sizes · chat</text>

  <path d="M297 287 H354" class="current-line"/>
  <path d="M487 344 V357" class="current-line"/>
  <path d="M672 287 H621" class="current-line"/>
  <path d="M814 344 V357" class="current-line"/>
  <path d="M297 313 C335 313 330 395 354 395" class="current-line"/>
  <path d="M957 287 H1081" class="current-line"/>
  <text x="1015" y="273" class="small" text-anchor="middle">HTTPS request</text>

  <rect x="1083" y="245" width="286" height="112" rx="8" class="node-blue"/>
  <text x="1105" y="275" class="node-title">Model API</text>
  <text x="1105" y="300" class="node-copy">OpenAI-compatible endpoint</text>
  <text x="1105" y="322" class="node-copy">Returns assistant completion</text>
  <text x="1105" y="343" class="small">Provider CORS required</text>
  <path d="M1083 333 H1028 V371 H968" class="current-line"/>
  <rect x="1083" y="383" width="286" height="48" rx="7" fill="#fbf1e9" stroke="#d7a07b"/>
  <text x="1226" y="404" class="note" text-anchor="middle" fill="#805638">Source content is not connected</text>
  <text x="1226" y="420" class="small" text-anchor="middle">Files are metadata only; names can be prompt hints</text>

  <rect x="35" y="505" width="1370" height="505" rx="12" class="panel-proposed"/>
  <text x="62" y="545" class="section">02  Recommended production design</text>
  <rect x="1155" y="521" width="220" height="28" rx="14" fill="#f3eddc"/>
  <text x="1265" y="540" class="tag" text-anchor="middle" fill="#8b7542">PROPOSED / NOT BUILT</text>

  <rect x="70" y="625" width="220" height="118" rx="8" class="node-gold"/>
  <text x="92" y="656" class="node-title">Web client</text>
  <text x="92" y="681" class="node-copy">Agent builder and chat</text>
  <text x="92" y="703" class="node-copy">No provider secrets</text>
  <text x="92" y="727" class="small">User authenticated</text>

  <rect x="355" y="625" width="230" height="118" rx="8" class="node-gold"/>
  <text x="377" y="656" class="node-title">Application backend</text>
  <text x="377" y="681" class="node-copy">AuthN / AuthZ · agent data</text>
  <text x="377" y="703" class="node-copy">Request validation</text>
  <text x="377" y="727" class="small">Policy and audit controls</text>

  <rect x="655" y="625" width="230" height="118" rx="8" class="node-gold"/>
  <text x="677" y="656" class="node-title">Model gateway</text>
  <text x="677" y="681" class="node-copy">Provider adapters</text>
  <text x="677" y="703" class="node-copy">Limits · safety · routing</text>
  <text x="677" y="727" class="small">Credentials via secret store</text>

  <rect x="1010" y="590" width="330" height="72" rx="8" class="node-gold"/>
  <text x="1032" y="620" class="node-title">Hosted model provider</text>
  <text x="1032" y="643" class="node-copy">API credentials from secret store</text>
  <rect x="1010" y="688" width="330" height="72" rx="8" class="node-gold"/>
  <text x="1032" y="718" class="node-title">Private / self-hosted model</text>
  <text x="1032" y="741" class="node-copy">Private network or model gateway</text>

  <path d="M290 684 H344" class="proposed-line"/>
  <text x="317" y="669" class="small" text-anchor="middle">HTTPS</text>
  <path d="M585 684 H644" class="proposed-line"/>
  <path d="M885 659 C935 659 945 626 999 626" class="proposed-line"/>
  <path d="M885 708 C935 708 945 724 999 724" class="proposed-line"/>

  <rect x="355" y="830" width="230" height="85" rx="8" class="node-gold"/>
  <text x="377" y="862" class="node-title">Agent database</text>
  <text x="377" y="887" class="node-copy">Workspace-scoped configuration</text>
  <rect x="655" y="830" width="230" height="85" rx="8" class="node-gold"/>
  <text x="677" y="862" class="node-title">Retrieval service</text>
  <text x="677" y="887" class="node-copy">Permission-aware search</text>
  <rect x="955" y="830" width="190" height="85" rx="8" class="node-gold"/>
  <text x="977" y="862" class="node-title">Search index</text>
  <text x="977" y="887" class="node-copy">Chunks · embeddings · ACLs</text>
  <rect x="1190" y="830" width="175" height="85" rx="8" class="node-gold"/>
  <text x="1207" y="862" class="node-title">Ingestion</text>
  <text x="1207" y="887" class="node-copy">Parse · scan · sync</text>
  <path d="M470 743 V827" class="proposed-line"/>
  <path d="M655 872 H610 V770 H470 V752" class="proposed-line"/>
  <path d="M955 872 H895" class="proposed-line"/>
  <path d="M1190 872 H1155" class="proposed-line"/>

  <rect x="655" y="945" width="710" height="42" rx="7" fill="#f3eddc" stroke="#d9cfb1" stroke-dasharray="6 4"/>
  <text x="1010" y="971" class="small" text-anchor="middle">Authorized source APIs: SharePoint · OneDrive · Teams · approved web sources</text>
  <path d="M1277 945 V922" class="proposed-line"/>

  <text x="62" y="984" class="small">Dashed boxes and arrows indicate proposed production components and flows.</text>
</svg>
